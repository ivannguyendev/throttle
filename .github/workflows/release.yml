name: Release

on:
  push:
    tags: ['v*']

# id-token: write lets npm exchange a GitHub OIDC token for a short-lived publish
# credential (trusted publishing). No NPM_TOKEN secret is stored anywhere.
permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          # Release builds never restore a cache.
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1. pnpm comes from npm, not corepack.
      - name: Install npm and pnpm
        run: npm install -g npm@latest pnpm@12.6.0

      - name: Verify tag matches package.json version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($expected)"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # prepublishOnly runs pnpm lint && pnpm test && pnpm build before packing.
      - name: Publish
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) npm publish --provenance --access public --tag next ;;
            *) npm publish --provenance --access public ;;
          esac
