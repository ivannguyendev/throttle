# Builds dist/ in a container, so the host needs only Docker:
#   docker compose run --rm builder
# The image is rebuilt on every run (pull_policy: build); the cached install
# layer keeps that fast. dist/ is replaced and owned by the project's owner.
services:
  builder:
    build: .
    image: throttle-window-builder
    pull_policy: build
    volumes:
      - .:/workspace
    command:
      - sh
      - -c
      - >-
        rm -rf /workspace/dist &&
        cp -R dist /workspace/dist &&
        chown -R "$$(stat -c '%u:%g' /workspace)" /workspace/dist &&
        ls -l /workspace/dist
